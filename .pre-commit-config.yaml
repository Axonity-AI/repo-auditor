# Setup (run once per clone):
#   pip install pre-commit
#   pre-commit install                      # installs the pre-commit stage hooks
#   pre-commit install --hook-type commit-msg   # installs the commit-msg stage hook (conventional commits)
#   pre-commit run --all-files              # first-run pass on the whole repo (review the diff before committing)
#
# Keep hook versions current periodically with: pre-commit autoupdate

repos:
  # Secret scanning — the single most important hook in this file. See
  # docs/postmortems/0001-secret-leak-2026-08-06.md for why this exists.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml

  # Conventional Commits enforcement (commit-msg stage — needs the second
  # `pre-commit install --hook-type commit-msg` above to actually run)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Python lint + format (single tool, replaces flake8+black+isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking (config in pyproject.toml [tool.mypy]) — same check the
  # CI `typecheck` job runs, catching it before it's even committed
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^src/
