[project]
name = "{{PACKAGE_NAME}}"
version = "0.1.0"
description = "{{PROJECT_NAME}}"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting — replaces isort as a separate tool)
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (modern Python idioms)
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that hit a real service (db, cache, etc.)",
    "slow: tests excluded from the default per-commit run",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
